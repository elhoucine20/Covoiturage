spring.application.name=covoiturage

# Charge le fichier .env situé à la racine du projet
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:covoiturage}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

logging.level.ma.youcode.covoiturage=INFO


